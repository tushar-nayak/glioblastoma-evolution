name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile scripts
        run: |
          python -m py_compile \
            scripts/generate_dummy_lumiere.py \
            scripts/preprocess_lumiere_registration.py \
            scripts/run_neural_ode_pipeline.py \
            scripts/summarize_run_metrics.py

      - name: Run unit tests
        run: python -m unittest discover -s tests
